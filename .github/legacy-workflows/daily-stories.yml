name: "Daily News — verified full-length English articles"
on:
  # Legacy NASA/FDA/DOE archive collector. Manual runs only; the D12
  # licensed image/world workflow is the scheduled source for Read.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-news-content
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing reader functionality
        run: node --test scripts/test/v22c-full.test.mjs scripts/test/history.test.mjs scripts/test/supply.test.mjs
      - name: Verify React build before publishing
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Collect source-attributed English reporting
        run: node scripts/v22c-collect.mjs
      - name: Verify at least 50 stories from three organizations
        run: node scripts/v22c-check.mjs --strict
      - name: Commit news-feed only (never republish encyclopedia content)
        run: |
          git config user.name 'daily-news-bot'
          git config user.email 'daily-news-bot@users.noreply.github.com'
          git add -A public/full-feed/
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified full-length English news feed'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
