name: SAGA Rewrite Old Articles

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of old articles to rewrite in this batch, e.g. 3 for test or 10 for batch'
        required: false
        default: '3'
        type: string
      include_old_v3:
        description: 'Also upgrade the 2 older wiki-v3 articles to the new breathable layout'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: saga-rewrite-old-articles
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Install Chromium and build editorial measurement reader
        run: |
          npx playwright install --with-deps chromium
          npm run build

      - name: Rewrite outdated Wikipedia articles to lore-v1
        id: rewrite
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          SAGA_IMAGE_TEST_API_KEY: ${{ secrets.SAGA_IMAGE_TEST_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          SAGA_EDITORIAL_LAYOUT: '3'
          SAGA_EDITORIAL_BASE_URL: http://127.0.0.1:4173
          GEMINI_DELAY_MS: '8000'
          MAX_RUNTIME_MS: '1440000'
          REWRITE_LIMIT: ${{ inputs.limit || '3' }}
          INCLUDE_OLD_V3: ${{ inputs.include_old_v3 && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if ! [[ "$REWRITE_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: Invalid limit '${REWRITE_LIMIT}'. Must be a positive integer."
            {
              echo "rewritten_count=0"
              echo "failed_count=0"
              echo "remaining_outdated_count="
              echo "stop_reason=infrastructure_failure"
              echo "has_valid_changes=false"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GEMINI_API_KEY_2" ] && [ -z "$GEMINI_API_KEY_3" ] && [ -z "$SAGA_IMAGE_TEST_API_KEY" ]; then
            echo "ERROR: No Gemini API key secret is configured."
            {
              echo "rewritten_count=0"
              echo "failed_count=0"
              echo "remaining_outdated_count="
              echo "stop_reason=infrastructure_failure"
              echo "has_valid_changes=false"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/saga-rewrite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          node scripts/publish_wiki_batch.mjs \
            --rewrite-outdated \
            --limit="$REWRITE_LIMIT" \
            --include-old-v3="$INCLUDE_OLD_V3"

      - name: Verify Wiki catalog and run production build
        id: verify
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/build-reader-index.mjs
          npm run build
          CHANGES=$(git status --porcelain -- public/wiki-reader)
          if [ -n "$CHANGES" ]; then
            echo "has_git_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_git_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push rewritten Wiki articles
        id: push
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.has_git_changes == 'true' && steps.rewrite.outputs.has_valid_changes == 'true' && steps.rewrite.outputs.rewritten_count != '0' && steps.rewrite.outputs.rewritten_count != '' }}
        continue-on-error: true
        env:
          REWRITTEN_COUNT: ${{ steps.rewrite.outputs.rewritten_count || '0' }}
          REMAINING_OUTDATED_COUNT: ${{ steps.rewrite.outputs.remaining_outdated_count || 'unknown' }}
          STOP_REASON: ${{ steps.rewrite.outputs.stop_reason || 'unknown' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wiki-reader
          if git diff --cached --quiet; then
            echo "No staged Wiki catalog changes to commit."
            exit 0
          fi
          TOTAL=$(node -e "const m=JSON.parse(require('fs').readFileSync('public/wiki-reader/manifest.json','utf8')); console.log(m.total)")
          MSG="chore(wiki): rewrite ${REWRITTEN_COUNT} old article(s) to lore-v1 (${TOTAL} total, ${REMAINING_OUTDATED_COUNT} outdated remaining, ${STOP_REASON})"
          git commit -m "$MSG"
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "ERROR: git pull --rebase failed."
            exit 1
          fi
          git push origin HEAD:main

      - name: Final rewrite status and summary
        id: final_status
        if: ${{ !cancelled() }}
        env:
          REWRITE_OUTCOME: ${{ steps.rewrite.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          REWRITTEN_COUNT: ${{ steps.rewrite.outputs.rewritten_count || '0' }}
          FAILED_COUNT: ${{ steps.rewrite.outputs.failed_count || '0' }}
          REMAINING_OUTDATED_COUNT: ${{ steps.rewrite.outputs.remaining_outdated_count || 'unknown' }}
          STOP_REASON: ${{ steps.rewrite.outputs.stop_reason || 'unknown' }}
          HAS_VALID_CHANGES: ${{ steps.rewrite.outputs.has_valid_changes || 'false' }}
          HAS_GIT_CHANGES: ${{ steps.verify.outputs.has_git_changes || 'false' }}
        run: |
          set -euo pipefail
          echo "Rewrite workflow status: rewritten=${REWRITTEN_COUNT}, skipped_or_failed=${FAILED_COUNT}, remaining_outdated=${REMAINING_OUTDATED_COUNT}, stop_reason=${STOP_REASON}, rewrite=${REWRITE_OUTCOME}, verify=${VERIFY_OUTCOME}, push=${PUSH_OUTCOME}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo ""
              echo "**Batch Result:** rewritten=\`${REWRITTEN_COUNT}\` · skipped/failed=\`${FAILED_COUNT}\` · remaining outdated=\`${REMAINING_OUTDATED_COUNT}\` · stop_reason=\`${STOP_REASON}\` · push=\`${PUSH_OUTCOME}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$VERIFY_OUTCOME" != "success" ]; then
            echo "ERROR: Catalog verification or production build failed."
            exit 1
          fi
          if [ "$PUSH_OUTCOME" = "failure" ]; then
            echo "ERROR: Pushing rewritten articles failed."
            exit 1
          fi
          if [ "$REWRITTEN_COUNT" = "0" ]; then
            if [ "$STOP_REASON" = "infrastructure_failure" ] && [ "$REWRITE_OUTCOME" != "success" ]; then
              echo "ERROR: Rewrite run aborted due to infrastructure or configuration failure before processing articles."
              exit 1
            fi
            echo "0 articles rewritten (stop_reason=${STOP_REASON}, remaining_outdated=${REMAINING_OUTDATED_COUNT}); exiting cleanly without an empty commit."
            exit 0
          fi
          if [ "$HAS_VALID_CHANGES" = "true" ] && [ "$HAS_GIT_CHANGES" = "true" ] && [ "$PUSH_OUTCOME" != "success" ]; then
            echo "ERROR: Rewritten articles were generated but push step did not succeed (push=${PUSH_OUTCOME})."
            exit 1
          fi
          echo "SAGA Rewrite Old Articles completed cleanly: rewritten=${REWRITTEN_COUNT}, skipped_or_failed=${FAILED_COUNT}, remaining_outdated=${REMAINING_OUTDATED_COUNT}."
