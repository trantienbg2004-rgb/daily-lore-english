name: CEFR Offline Research Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/cefr-cmudict-audit.mjs'
      - '.github/workflows/cefr-offline-research.yml'
      - 'docs/cefr-pilot-root-cause.md'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare independent pronunciation dictionary
        run: |
          python -m pip install cmudict==1.1.3
          python - <<'PY'
          import cmudict, json
          d = {w: sorted({sum(p[-1:].isdigit() for p in pronunciation) for pronunciation in variants}) for w, variants in cmudict.dict().items()}
          with open('/tmp/cmu-syllables.json', 'w') as f:
              json.dump(d, f)
          PY
      - name: Audit every catalog variant without Gemini
        run: node scripts/cefr-cmudict-audit.mjs /tmp/cmu-syllables.json
      - uses: actions/upload-artifact@v4
        with:
          name: cefr-cmudict-research
          path: cefr-cmudict-report.json
          retention-days: 14
