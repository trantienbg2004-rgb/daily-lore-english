name: QA Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/continuousReader.js'
      - 'src/lib/recommendationEngine.js'
      - 'src/lib/feedQueue.js'
      - 'src/App.jsx'
      - 'scripts/test/saga-recommendation-v2.test.mjs'
      - '.github/workflows/qa-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Build, Unit, Lint & Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Run Playwright E2E QA suite
        run: npm run test:e2e

      - name: Upload Playwright failure screenshots & traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: saga-qa-failure-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
