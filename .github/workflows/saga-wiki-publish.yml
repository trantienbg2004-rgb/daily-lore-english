name: SAGA Wikipedia - staging collection

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saga-wiki-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/saga-wikipedia-first-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate and audit a bounded free-tier batch
        env:
          SAGA_WIKI_GEMINI_KEY: ${{ secrets.SAGA_IMAGE_TEST_API_KEY }}
          SAGA_WIKI_FREE_TIER_CONFIRMED: '1'
          SAGA_WIKI_CHECKPOINT_BRANCH: feat/saga-wikipedia-first-20261020
        run: node scripts/wiki-pipeline.mjs batch --max-calls=8 --max-candidates=24
      - name: Verify before publication
        run: |
          npm test
          node scripts/lore-verify.mjs
          npm run build
          git diff --check
      - name: Preserve review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saga-wiki-collection-${{ github.run_id }}
          path: reports/saga-wiki-local/
          if-no-files-found: ignore
          retention-days: 7
