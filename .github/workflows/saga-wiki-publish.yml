name: SAGA Wikipedia - collect and publish

on:
  schedule:
    - cron: '37 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
    inputs:
      max_calls:
        description: Gemini calls for this run, or probe model access without generation
        type: choice
        options:
          - '0'
          - '8'
          - 'probe'
        default: '0'

permissions:
  contents: write

concurrency:
  group: saga-wiki-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out durable staging branch
        uses: actions/checkout@v4
        with:
          ref: feat/saga-wikipedia-first-20261020
          path: staging
          persist-credentials: true
      - name: Check out current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: staging/package-lock.json
      - run: npm ci
        working-directory: staging
      - name: Refill Wikipedia queue only when a topic runs low
        working-directory: staging
        env:
          SAGA_WIKI_CHECKPOINT_BRANCH: feat/saga-wikipedia-first-20261020
        run: node scripts/wiki-pipeline.mjs topup --min-per-topic=8 --max-topics=3
      - name: Check free Gemini model access without generating text
        if: github.event_name == 'schedule' || github.event.inputs.max_calls == '8' || github.event.inputs.max_calls == 'probe'
        id: free_model
        working-directory: staging
        env:
          SAGA_WIKI_GEMINI_KEY: ${{ secrets.SAGA_IMAGE_TEST_API_KEY }}
        run: node scripts/wiki/model-availability.mjs
      - name: Prepare and edit a bounded free-tier batch
        working-directory: staging
        env:
          SAGA_WIKI_GEMINI_KEY: ${{ secrets.SAGA_IMAGE_TEST_API_KEY }}
          SAGA_WIKI_FREE_TIER_CONFIRMED: '1'
          SAGA_WIKI_CHECKPOINT_BRANCH: feat/saga-wikipedia-first-20261020
          SAGA_WIKI_MODEL: ${{ steps.free_model.outputs.model || 'gemini-3.5-flash-lite' }}
          SAGA_WIKI_MODELS: ${{ steps.free_model.outputs.models || '' }}
          SAGA_WIKI_MAX_CALLS: ${{ steps.free_model.outputs.available == 'true' && (github.event_name == 'schedule' || github.event.inputs.max_calls == '8') && '8' || '0' }}
        run: node scripts/wiki-pipeline.mjs batch --max-calls="$SAGA_WIKI_MAX_CALLS" --max-candidates=16
      - name: Verify staged stories and Reader
        working-directory: staging
        run: |
          npm test
          node scripts/lore-verify.mjs
          npm run build
          git diff --check
      - run: npm ci
        working-directory: production
      - name: Promote only new verified Wiki stories
        working-directory: staging
        run: node scripts/wiki-promote.mjs ../production
      - name: Verify production catalog before commit
        working-directory: production
        run: |
          node scripts/lore-verify.mjs
          npm run build
          git diff --check
      - name: Publish catalog to production branch
        working-directory: production
        run: |
          git config user.name saga-wiki-publisher
          git config user.email saga-wiki-publisher@users.noreply.github.com
          git add public/wiki-reader/
          if git diff --cached --quiet; then
            echo 'No new approved Wiki stories'
          else
            git diff --cached --check
            git commit -m 'SAGA: publish verified Wikipedia stories'
            git push origin HEAD:main
          fi
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saga-wiki-collection-${{ github.run_id }}
          path: staging/reports/saga-wiki-local/
          if-no-files-found: ignore
          retention-days: 7
