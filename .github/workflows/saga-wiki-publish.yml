name: SAGA Wikipedia - collect and publish

on:
  schedule:
    # Automatic daily collection cycles on main (4 times/day, bounded free-tier budget).
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      max_calls:
        description: Gemini calls for this run, or probe model access without generation
        type: choice
        options:
          - '20'
          - '8'
          - '0'
          - 'probe'
        default: '20'
      relay:
        description: Continue bounded collection every 25 minutes after this run
        type: choice
        options:
          - 'off'
          - 'on'
        default: 'off'

permissions:
  contents: write
  actions: write

concurrency:
  group: saga-wiki-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check free Gemini model access without generating text
        if: github.event_name == 'schedule' || github.event.inputs.max_calls == '8' || github.event.inputs.max_calls == '20' || github.event.inputs.max_calls == 'probe'
        id: free_model
        env:
          SAGA_WIKI_GEMINI_KEY: ${{ secrets.SAGA_IMAGE_TEST_API_KEY || secrets.GEMINI_API_KEY }}
        run: node scripts/wiki/model-availability.mjs
      - name: Run automated full-article Wikipedia sync and self-audit
        if: github.event.inputs.max_calls != 'probe'
        env:
          SAGA_WIKI_GEMINI_KEY: ${{ secrets.SAGA_IMAGE_TEST_API_KEY || secrets.GEMINI_API_KEY }}
          SAGA_WIKI_FREE_TIER_CONFIRMED: '1'
          SAGA_WIKI_MODEL: ${{ steps.free_model.outputs.model || 'gemini-2.5-flash' }}
          SAGA_WIKI_MODELS: ${{ steps.free_model.outputs.models || '' }}
          SAGA_WIKI_MAX_CALLS: ${{ steps.free_model.outputs.available == 'true' && (github.event_name == 'schedule' && '20' || github.event.inputs.max_calls == '20' && '20' || github.event.inputs.max_calls == '8' && '8') || '0' }}
        run: node scripts/wiki-auto.mjs --mode=sync --count=5 --max-calls="$SAGA_WIKI_MAX_CALLS"
      - name: Verify stories, section-locked images, tests, and build
        run: |
          npm test
          node scripts/wiki-audit.mjs
          node scripts/lore-verify.mjs
          npm run build
          git diff --check
      - name: Commit and publish newly verified Wikipedia stories to main
        run: |
          git config user.name saga-wiki-publisher
          git config user.email saga-wiki-publisher@users.noreply.github.com
          git add public/wiki-reader/ data/wiki-pipeline-state.json data/wiki-checkpoints/ 2>/dev/null || git add public/wiki-reader/
          if git diff --cached --quiet; then
            echo 'No new approved Wiki stories or queue updates'
          else
            git diff --cached --check
            git commit -m 'SAGA: publish verified Wikipedia stories'
            git push origin HEAD:main
          fi
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saga-wiki-collection-${{ github.run_id }}
          path: reports/saga-wiki-local/
          if-no-files-found: ignore
          retention-days: 7
  relay:
    if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.relay == 'on') }}
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dispatch the next bounded run unless another run has taken over
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/wiki/relay.mjs
