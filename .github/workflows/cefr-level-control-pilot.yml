name: SAGA CEFR Live Level-Control Pilot

on:
  push:
    branches: [fix/saga-cefr-level-control]
    paths:
      - 'scripts/cefr-level-control-pilot.mjs'
      - 'scripts/publish_wiki_batch.mjs'
      - '.github/workflows/cefr-level-control-pilot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/cefr-level-control-pilot.mjs'
      - 'scripts/publish_wiki_batch.mjs'
      - '.github/workflows/cefr-level-control-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: saga-cefr-live-level-control-pilot
  cancel-in-progress: true

jobs:
  live-pilot:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fix/saga-cefr-level-control' || (github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'fix/saga-cefr-level-control' || github.event.pull_request.head.ref == 'fix/saga-independent-cefr-reviewer-20261127'))
    runs-on: ubuntu-latest
    # Allow bounded model failover plus generation, review, targeted repair, and final re-review for three frozen topics.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Download frozen source fixtures from the completed matched trial
        uses: actions/download-artifact@v4
        with:
          name: saga-cefr-matched-research
          path: /tmp/saga-cefr-frozen
          repository: ${{ github.repository }}
          run-id: 45857492873
          github-token: ${{ github.token }}
      - name: Validate pilot script
        run: node --check scripts/cefr-level-control-pilot.mjs
      - name: Run live generation and descriptor-review pilot (no production writes)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          SAGA_IMAGE_TEST_API_KEY: ${{ secrets.SAGA_IMAGE_TEST_API_KEY }}
          CEFR_FROZEN_INPUT: /tmp/saga-cefr-frozen
          CEFR_PILOT_OUTPUT: /tmp/saga-cefr-level-control-pilot
          CEFR_PILOT_MODEL: gemini-3.5-flash-lite
          CEFR_REVIEW_MODEL: gemini-3.6-flash
          CEFR_REVIEW_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.1-flash-lite,gemini-4-hydrogen
        run: node scripts/cefr-level-control-pilot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saga-cefr-level-control-live-pilot
          path: /tmp/saga-cefr-level-control-pilot/
          if-no-files-found: warn
          retention-days: 14
