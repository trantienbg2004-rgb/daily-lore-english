name: Reader editorial pilot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/reader-editorial-pilot.yml'
      - 'scripts/wiki/editorial-meter.mjs'
      - 'scripts/test/editorial-offline-pilot.mjs'
      - 'scripts/test/fixtures/editorial-pilot-texts.mjs'
      - 'src/App.css'
      - 'src/App.jsx'
      - 'scripts/publish_wiki_batch.mjs'
permissions:
  contents: read
concurrency:
  group: editorial-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/reader-page-rhythm'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Stage test-only editorial fixtures (no Gemini, no production mutation)
        run: node scripts/test/editorial-offline-pilot.mjs
      - run: npm run build
      - name: Measure real Reader on every pilot page
        env:
          SAGA_REQUIRE_EDITORIAL_PILOT: '1'
        run: npx playwright test --grep 'Visual regression:' --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-offline-evidence-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
