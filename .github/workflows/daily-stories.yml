name: Add a daily reading story
on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch one new story
        run: node scripts/update-stories.mjs
      - name: Commit updated library
        run: |
          git config user.name 'daily-lore-bot'
          git config user.email 'daily-lore-bot@users.noreply.github.com'
          git add public/stories.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add daily reading story'
            git push
          fi
