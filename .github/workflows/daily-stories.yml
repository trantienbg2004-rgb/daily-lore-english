name: Update knowledge and news stories
on:
  schedule:
    - cron: '7,37 * * * *'
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-news-content
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test collector without calling external APIs
        run: node --test scripts/test/ingestion.test.mjs
      - name: Fetch and publish long articles
        env:
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 1 * * *' }}
        run: |
          if [ "$BOOTSTRAP" = "true" ]; then
            node scripts/update-stories.mjs --bootstrap
          else
            node scripts/update-stories.mjs
          fi
      - name: Check feed integrity
        run: node scripts/validate-feed.mjs
      - name: Commit and push if changed
        run: |
          git config user.name 'daily-lore-bot'
          git config user.email 'daily-lore-bot@users.noreply.github.com'
          git add public/stories.json public/feed/
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily news content library'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
