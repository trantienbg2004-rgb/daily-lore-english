name: Update knowledge and news stories
on:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-lore-content
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch news and knowledge stories
        run: node scripts/update-stories.mjs
      - name: Commit and push if changed
        run: |
          git config user.name 'daily-lore-bot'
          git config user.email 'daily-lore-bot@users.noreply.github.com'
          git add public/stories.json public/feed
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily lore news and discoveries'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
