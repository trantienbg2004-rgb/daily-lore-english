name: "Update Daily News English articles"
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-news-content
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing reader functionality
        run: node --test scripts/test/*.test.mjs
      - name: Verify React build before publishing
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Collect source-attributed English reporting
        run: node scripts/v22a-collect.mjs
      - name: Verify at least 50 stories from three organizations
        run: node scripts/v22a-check.mjs --strict
      - name: Commit news-feed only (never republish encyclopedia content)
        run: |
          git config user.name 'daily-news-bot'
          git config user.email 'daily-news-bot@users.noreply.github.com'
          git add -A public/news-feed/
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified English publisher news feed'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
